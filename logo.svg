<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the K shape -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6CF7" />
      <stop offset="100%" stop-color="#00BFA6" />
    </linearGradient>

    <!-- Subtle glow for nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BFA6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00BFA6" stop-opacity="0" />
    </radialGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0B2E" />
      <stop offset="100%" stop-color="#1B1464" />
    </linearGradient>

    <!-- Glow filter for accent elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="64" ry="64" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern suggesting structure -->
  <g opacity="0.06" stroke="#7B8CFF" stroke-width="0.5">
    <line x1="128" y1="16" x2="128" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="384" y1="16" x2="384" y2="496" />
    <line x1="16" y1="128" x2="496" y2="128" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="384" x2="496" y2="384" />
  </g>

  <!-- Connection lines between nodes (agent network) — drawn first, behind K -->
  <g stroke="#00BFA6" stroke-width="1.5" opacity="0.3">
    <!-- Vertical stem connections -->
    <line x1="168" y1="112" x2="168" y2="400" />
    <!-- Upper diagonal connections -->
    <line x1="168" y1="240" x2="344" y2="112" />
    <!-- Lower diagonal connections -->
    <line x1="168" y1="272" x2="344" y2="400" />
    <!-- Cross connections -->
    <line x1="256" y1="176" x2="344" y2="112" />
    <line x1="256" y1="336" x2="344" y2="400" />
    <!-- Horizontal bridge -->
    <line x1="168" y1="256" x2="256" y2="256" />
  </g>

  <!-- The K lettermark — geometric, faceted -->
  <g fill="url(#kGrad)">
    <!-- Vertical stem -->
    <rect x="148" y="112" width="40" height="288" rx="4" />

    <!-- Upper diagonal arm -->
    <polygon points="188,270 188,230 340,108 340,160" />

    <!-- Lower diagonal arm -->
    <polygon points="188,242 188,282 340,404 340,352" />
  </g>

  <!-- Facet highlight on upper arm -->
  <polygon points="188,250 188,230 340,108 340,134" fill="#FFFFFF" opacity="0.1" />

  <!-- Agent network nodes at key vertices -->
  <g filter="url(#glow)">
    <!-- Top of stem — CEO node -->
    <circle cx="168" cy="112" r="8" fill="#00BFA6" />
    <circle cx="168" cy="112" r="14" fill="none" stroke="#00BFA6" stroke-width="1" opacity="0.4" />

    <!-- Bottom of stem — CFO node -->
    <circle cx="168" cy="400" r="7" fill="#00BFA6" />
    <circle cx="168" cy="400" r="12" fill="none" stroke="#00BFA6" stroke-width="1" opacity="0.4" />

    <!-- Center junction — conductor node (largest) -->
    <circle cx="168" cy="256" r="10" fill="#00BFA6" />
    <circle cx="168" cy="256" r="16" fill="none" stroke="#00BFA6" stroke-width="1.5" opacity="0.5" />

    <!-- Upper arm tip — CTO node -->
    <circle cx="344" cy="112" r="7" fill="#4A6CF7" />
    <circle cx="344" cy="112" r="12" fill="none" stroke="#4A6CF7" stroke-width="1" opacity="0.4" />

    <!-- Lower arm tip — CRO node -->
    <circle cx="344" cy="400" r="7" fill="#4A6CF7" />
    <circle cx="344" cy="400" r="12" fill="none" stroke="#4A6CF7" stroke-width="1" opacity="0.4" />

    <!-- Mid upper — CPO node -->
    <circle cx="256" cy="176" r="5" fill="#7B8CFF" />

    <!-- Mid lower — CMO node -->
    <circle cx="256" cy="336" r="5" fill="#7B8CFF" />
  </g>

  <!-- "KOMPANY" wordmark below the K -->
  <text x="256" y="462" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="8" fill="#FFFFFF" opacity="0.9">
    KOMPANY
  </text>

</svg>