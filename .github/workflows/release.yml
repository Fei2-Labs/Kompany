name: Release

# Manually triggered only. Releases are a deliberate, human-initiated action.
#
# Stage C contract (07-24-stage-c-github-only-deploy):
#   * This workflow never pushes to `main`. The version bump is an ordinary
#     reviewed PR (edit `kompany/pyproject.toml` `[project] version`); this
#     workflow releases whatever version `main` already declares and refuses
#     to run if that tag exists. Branch protection on `main` therefore holds
#     for CI too — no bot bypass.
#   * The wheel carries its own identity: `kompany/release.json` (version,
#     commit, tag, workflow run URL) is written before `python -m build`, so
#     a running engine can say "I am GitHub release vX at sha Y" and detect
#     drift when a data dir that ran a release is later served by a source
#     checkout (core/release_info.py).
#   * Every artifact gets a SHA-256 in `release-manifest.json`, the manifest
#     gets a `release_digest`, and GitHub signs build provenance for all of
#     them (actions/attest-build-provenance). Verify with
#     `gh attestation verify <file> --repo Fei2-Labs/Kompany`.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        working-directory: kompany
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,dev]"
      - name: Run test suite (excluding distillation, see CI notes)
        working-directory: kompany
        run: |
          pytest tests/ --ignore=tests/test_distillation.py -q
      - name: Run release-gating compat tests (wheel build/install, migration, concurrency)
        working-directory: kompany
        run: |
          pytest -m compat -q

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build hatchling

      - name: Resolve version from pyproject.toml and refuse duplicates
        id: ver
        working-directory: kompany
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::releases are cut from main only (got ${GITHUB_REF})"; exit 1
          fi
          VERSION=$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists — bump [project] version in kompany/pyproject.toml via a PR first"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} from $(git rev-parse HEAD)"

      - name: Stamp release identity into the package
        working-directory: kompany
        run: |
          python - <<'PY'
          import json, os, subprocess
          stamp = {
              "source": "github-actions",
              "version": "${{ steps.ver.outputs.version }}",
              "tag": "${{ steps.ver.outputs.tag }}",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip(),
              "built_at": subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]).decode().strip(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          with open("src/kompany/release.json", "w") as f:
              json.dump(stamp, f, indent=2)
          print(json.dumps(stamp, indent=2))
          PY

      - name: Build wheel + sdist
        working-directory: kompany
        run: python -m build --wheel --sdist

      - name: Package ops/browser tarball (if present)
        working-directory: kompany
        run: |
          if [ -d ops/browser ]; then
            tar -czf "dist/kompany-ops-browser-${{ steps.ver.outputs.version }}.tar.gz" -C ops browser
          else
            echo "::notice::ops/browser not present — skipping ops tarball"
          fi

      - name: Generate release manifest with checksums + digest
        working-directory: kompany
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess

          version = "${{ steps.ver.outputs.version }}"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
          artifacts = {}
          for name in sorted(os.listdir("dist")):
              path = os.path.join("dist", name)
              with open(path, "rb") as f:
                  artifacts[name] = {"sha256": hashlib.sha256(f.read()).hexdigest(), "bytes": os.path.getsize(path)}
          # One digest over every artifact hash — what an updater pins and what
          # a person compares against the GitHub Release page.
          digest_input = "\n".join(f"{v['sha256']}  {k}" for k, v in artifacts.items()).encode()
          manifest = {
              "schema": 2,
              "package": "kompany",
              "version": version,
              "tag": "v" + version,
              "release_id": f"{version}+{commit[:12]}",
              "commit": commit,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "built_at": subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]).decode().strip(),
              "release_digest": hashlib.sha256(digest_input).hexdigest(),
              "artifacts": artifacts,
          }
          with open("dist/release-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Attest build provenance (wheel, sdist, ops tarball, manifest)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            kompany/dist/*.whl
            kompany/dist/*.tar.gz
            kompany/dist/release-manifest.json

      - name: Tag the released commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Kompany ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Kompany ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: |
            kompany/dist/*.whl
            kompany/dist/*.tar.gz
            kompany/dist/release-manifest.json
