[package]
name = "kompany-desktop"
version = "0.1.0"
description = "Kompany — autonomous business OS, desktop shell."
authors = ["Kompany"]
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "kompany-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
log = "0.4"

[features]
default = ["custom-protocol"]
# Build-time switch the Tauri CLI flips when bundling release builds.
custom-protocol = ["tauri/custom-protocol"]
