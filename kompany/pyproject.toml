[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kompany"
version = "0.1.0"
description = "Autonomous business operating system for solo founders"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
# Edge-CDP browser tools for the agentic loop (06-16 P4). Optional: the
# browser tools degrade to a clear observation when Playwright is absent.
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Desktop bundle build: PyInstaller produces the sidecar binary that
# the Tauri shell spawns. Pillow only needed to render the placeholder
# icon — designer assets bypass it. See kompany/build_desktop.sh.
desktop = ["pyinstaller>=6", "pillow>=10"]

[project.scripts]
kompany = "kompany.interfaces.cli:app"
kompany-mcp = "kompany.interfaces.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kompany"]
# Templates ship as data inside the package — manifests and markdown
# bodies must end up next to the code at install time so
# ``importlib.resources.files('kompany').joinpath('templates/...')``
# resolves correctly from a wheel or a sdist.
include = [
    "src/kompany/**/*.py",
    "src/kompany/templates/**/*.json",
    "src/kompany/templates/**/*.md",
    "src/kompany/agents/souls/*.yaml",
    "src/kompany/workflows/*.yaml",
    "src/kompany/web_ui/**/*.html",
    "src/kompany/web_ui/**/*.js",
    "src/kompany/web_ui/**/*.css",
    "src/kompany/web_ui/**/*.ttf",
    # Operations board SPA (built by board-ui via `vite build`). Must be
    # listed here or the desktop `--collect-all kompany` bundle drops it.
    "src/kompany/board_ui/dist/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/kompany/**/*.py",
    "src/kompany/templates/**/*.json",
    "src/kompany/templates/**/*.md",
    "src/kompany/agents/souls/*.yaml",
    "src/kompany/workflows/*.yaml",
    "src/kompany/web_ui/**/*.html",
    "src/kompany/web_ui/**/*.js",
    "src/kompany/web_ui/**/*.css",
    "src/kompany/web_ui/**/*.ttf",
    "src/kompany/board_ui/dist/**/*",
    "tests/**/*.py",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
