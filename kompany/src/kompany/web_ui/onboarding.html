<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kompany // First Boot</title>
  <link rel="icon" type="image/png" href="/ui/static/favicon.png">
  <link rel="stylesheet" href="/ui/static/style.css?v=7">
</head>
<body class="onboarding-body">
  <!-- Step-aware header. The label after the slash is rewritten by JS
       as the founder advances through the wizard. -->
  <div class="header" id="onb-header">
    <div class="brand"><img src="/ui/static/logo.png" alt="K" class="brand-logo">KOMPANY//<span id="onb-step-label">FIRST-BOOT</span> <span class="blink">&#9608;</span></div>
    <div class="stats">
      <div class="stat"><span>step:</span> <b id="onb-step-count">0/7</b></div>
      <div class="stat"><span>status:</span> <b id="onb-status">awaiting input</b></div>
    </div>
  </div>

  <!-- Resume banner — surfaces an existing localStorage draft. Hidden by
       default; the state machine flips ``hidden`` after detecting a
       draft on boot. -->
  <div class="onb-resume" id="onb-resume" hidden>
    <div class="onb-resume-head">▾ RESUME PREVIOUS SESSION</div>
    <div class="onb-resume-body" id="onb-resume-body">
      <span id="onb-resume-meta">saved earlier</span>
      <span class="onb-resume-note">API key cleared for security — please re-enter.</span>
    </div>
    <div class="onb-resume-actions">
      <button type="button" class="onb-btn onb-btn-resume" id="onb-resume-yes">[ resume ]</button>
      <button type="button" class="onb-btn onb-btn-discard" id="onb-resume-no">[ start fresh ]</button>
    </div>
  </div>

  <!-- Single shell container; every step renders into ``#onb-step``. -->
  <div class="onboarding-shell">
    <div class="onb-step-host" id="onb-step"></div>

    <div id="onb-error" class="onb-error" hidden></div>
  </div>

  <script type="module" src="/ui/static/modules/ui/onboarding.js?v=7"></script>
</body>
</html>
